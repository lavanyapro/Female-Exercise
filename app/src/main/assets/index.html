<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:block}
@font-face{font-family:"Inter";src:url(fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrainsmono.woff2) format("woff2");font-weight:100 800;font-display:block}
</style>
<title>Petite Power Workouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app shell — figure hero + tab bar; one column on phones, two-up cards on wide screens; full-screen workout player overlay */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F6F8F5; --ink:#14201B; --muted:#5A6962; --line:#D3DCD5;
  --accent:#C2255C; --accent-soft:#F7DCE6; --accent-2:#23805F; --accent-2-soft:#D8EFE5; --warn:#B87503;
  --skin:#E2A584; --skin-far:#C4876A; --hair:#3A2420; --kit:#2B3833; --kit-far:#1B2521; --top:#C2255C; --band:#F2B8CB;
  --shoe:#FFFFFF; --sole:#C2255C; --lip:#C9566A; --eye:#2A1A17; --blush:#F27A98;
  --outline:#2E1C1A; --hair-hi:#8A5A48; --iris:#7A3E8C; --iris-2:#3B1F4A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --surface-2:#1F2924; --ink:#E7EEEA; --muted:#97A59E; --line:#2B3732;
  --accent:#F0628F; --accent-soft:#3D1A28; --accent-2:#4CC79B; --accent-2-soft:#163428; --warn:#E3A537;
  --skin:#E2A584; --skin-far:#B47C60; --hair:#4A2E25; --kit:#3E4F48; --kit-far:#2C3A34; --top:#F0628F; --band:#F7C6D6;
  --shoe:#F4F4F2; --sole:#F0628F; --lip:#B85A5E; --eye:#2A1A17; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --surface-2:#1F2924; --ink:#E7EEEA; --muted:#97A59E; --line:#2B3732;
  --accent:#F0628F; --accent-soft:#3D1A28; --accent-2:#4CC79B; --accent-2-soft:#163428; --warn:#E3A537;
  --skin:#E2A584; --skin-far:#B47C60; --hair:#4A2E25; --kit:#3E4F48; --kit-far:#2C3A34; --top:#F0628F; --band:#F7C6D6;
  --shoe:#F4F4F2; --sole:#F0628F; --lip:#B85A5E; --eye:#2A1A17; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700}
h3{font-size:17px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;gap:14px;min-width:0;padding-block:8px}
.hero-copy p{margin:0;max-width:52ch;color:var(--muted)}
.hero-copy h1 em{font-style:normal;color:var(--accent)}
.hero-copy h1{font-size:clamp(26px,5vw,42px)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden;min-height:260px}
.stage canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
.stage-tag{position:absolute;left:14px;bottom:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.ruler{position:absolute;right:12px;top:14px;bottom:30px;width:34px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right;border-right:2px solid var(--line);padding-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.mint{background:var(--accent-2)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* tabs */
/* app shell: sticky app bar + bottom navigation */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;fill:var(--accent)}
.appbar-day{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px;min-width:0}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{background:var(--accent-soft);border-radius:999px;padding:1px 10px;width:44px;box-sizing:content-box}
@media (min-width:900px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:620px;bottom:14px;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.12)}}
section[role="tabpanel"]{margin-top:8px}
/* anime mascot */
.greet{display:flex;align-items:flex-end;gap:10px}
.mascot{width:108px;height:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.m-line *{stroke:var(--outline);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.m-hair{fill:var(--hair)}.m-skin{fill:var(--skin)}.m-kit{fill:var(--kit)}.m-top{fill:var(--top)}.m-shoe{fill:var(--shoe)}
.m-arm{fill:none;stroke:var(--skin)!important;stroke-width:6.5!important}.m-arm-o{fill:none;stroke-width:10!important}
.m-hi{fill:none;stroke:var(--hair-hi);stroke-width:3;stroke-linecap:round}
.m-pupil{fill:#22121C}.m-shine{fill:#fff}.m-lash{fill:none;stroke:var(--outline);stroke-width:2.8;stroke-linecap:round}
.m-blush{fill:var(--blush);opacity:.55}.m-mouth{fill:var(--lip);stroke:var(--outline);stroke-width:1.2}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;margin-bottom:28px;min-width:0}
.bubble b{font-family:var(--f-display);font-size:17px;line-height:1.2}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}
button,.chip,.tabs,.appbar{-webkit-user-select:none;user-select:none}
section[role="tabpanel"]{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.today{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:flex;flex-direction:column}
.ex-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.ex-row:first-child{border-top:0}
.ex-row canvas{width:64px;height:56px;background:var(--surface-2);border-radius:10px}
.ex-row .nm{font-weight:600}
.ex-row .meta{font-size:12.5px;color:var(--muted)}
.dose{font-family:var(--f-mono);font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.c-Strength{background:#E9E3F7;color:#4B2E91}.c-Machine{background:#DDE9F6;color:#1D4F86}.c-Cardio{background:#FBE7D3;color:#8A4A06}
.c-HIIT{background:#FADADD;color:#9B1C2B}.c-Pilates{background:#D8EFE5;color:#17634A}.c-Yoga{background:#F3EBCF;color:#6F5708}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{filter:saturate(.9) brightness(.85)} }
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.focus{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.focus .lbl{display:flex;justify-content:space-between;font-size:13px}

/* week */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.day{display:flex;flex-direction:column;gap:10px}
.day.is-today{border:2px solid var(--accent)}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day .dname{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.day li{font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:3px 8px}

/* library */
.filters{display:flex;flex-direction:column;gap:10px}
.filters input{width:100%;max-width:420px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.lcard:hover{border-color:var(--accent)}
.lcard canvas{width:100%;height:130px;background:var(--surface-2);border-radius:10px}
.lcard .nm{font-weight:700;font-size:14.5px}
.lcard .tg{font-size:12px;color:var(--muted)}

/* progress */
.prog{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input{width:96px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}
.spark{width:100%;height:150px;display:block}
.ex-note{font-size:12px;color:var(--warn);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.weekdots i{display:block;height:34px;border-radius:9px;background:var(--surface-2);margin-bottom:4px}
.weekdots i.on{background:var(--accent-2)}

/* tips */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tips .card p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tips .big{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--accent-2)}

/* korean diet */
.diet-top{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.plate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12.5px}
.plate div{background:var(--surface-2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.plate b{font-family:var(--f-display);font-size:20px;color:var(--accent-2)}
.ko{font-size:12px;color:var(--muted);font-weight:500}
.meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.meal{display:flex;flex-direction:column;gap:4px}
.meal .when{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.meal .nm{font-weight:700}
.meal .nut{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:auto}
.daytotal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swaps td:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.warn{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:14px}
.grocery{columns:2 200px;column-gap:18px;margin:0;padding-left:18px;font-size:14px}
@media (max-width:820px){.diet-top{grid-template-columns:1fr}.plate{grid-template-columns:repeat(2,1fr)}}

/* modal + player */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 22px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet canvas{width:100%;height:220px;background:var(--surface-2);border-radius:14px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--accent-2-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.x{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1;flex:none}
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:auto}
.ptop{display:flex;align-items:center;gap:12px}
.ptop .bar{flex:1}
.pmain{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;max-width:1000px;width:100%;margin:0 auto;align-items:center}
.pstage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:280px;height:100%;max-height:520px}
.pstage canvas{position:absolute;inset:0;width:100%;height:100%}
.pphase{position:absolute;top:12px;left:12px}
.pinfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(56px,12vw,96px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.clock.rest{color:var(--accent-2)}
.setdots{display:flex;gap:6px}
.setdots i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.setdots i.done{background:var(--accent)}
.setdots i.cur{background:var(--ink)}
.pcues{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.pctl{display:flex;gap:10px;flex-wrap:wrap}
.pctl .btn{flex:1;justify-content:center;min-width:110px}
.upnext{font-size:13px;color:var(--muted)}
.confirm{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2}
.confirm .card{max-width:360px;display:flex;flex-direction:column;gap:12px}
.done-wrap{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}

@media (max-width:820px){
  .hero,.today,.prog,.pmain{grid-template-columns:1fr}
  .stage{min-height:240px}
  .pstage{min-height:240px;height:42vh}
}
@media (max-width:420px){ .stats{grid-template-columns:repeat(3,1fr)} .stat .v{font-size:20px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<header class="appbar">
  <div class="appbar-in">
    <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-30 12 12)"><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/><rect x="0" y="10" width="2" height="4" rx=".6"/><rect x="22" y="10" width="2" height="4" rx=".6"/><rect x="6" y="11" width="12" height="2"/></g></svg>Petite Power</span>
    <span class="appbar-day" id="appbarDay"></span>
  </div>
</header>
<div class="wrap">
  <div class="hero" id="hero">
    <div class="hero-copy">
      <div class="greet">
        <svg class="mascot" viewBox="0 6 120 136" aria-hidden="true">
          <defs><linearGradient id="mIris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B1F4A"/><stop offset="1" stop-color="#C0609A"/></linearGradient></defs>
          <g class="m-line">
            <path class="m-hair" d="M82 20 C108 14 118 40 109 62 C104 75 96 82 93 94 C93 78 98 64 92 50 C88 40 84 34 78 28 Z"/>
            <path class="m-hair" d="M24 54 C19 22 44 9 62 10 C86 11 101 27 96 56 C95 68 91 76 87 82 L33 82 C28 76 25 66 24 54 Z"/>
            <path class="m-kit" d="M47 112 L46 130 L56 130 L60 118 L64 130 L74 130 L73 112 Z"/>
            <rect class="m-shoe" x="42" y="129" width="16" height="7.5" rx="3.7"/>
            <rect class="m-shoe" x="62" y="129" width="16" height="7.5" rx="3.7"/>
            <path class="m-arm-o" d="M45 88 C37 96 35 104 37 112"/><path class="m-arm" d="M45 88 C37 96 35 104 37 112"/>

const live=new Set();
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);const W=Math.round(r.width*d),H=Math.round(r.height*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}return [W,H];}
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{e.target._vis=e.isIntersecting;}),{rootMargin:"100px"}):null;
function attach(cv,motion){cv._m=M[motion]||M.stand;cv._vis=true;cv._off=Math.random()*3;live.add(cv);io&&io.observe(cv);}
function detachIn(root){live.forEach(cv=>{if(!document.body.contains(cv)||(root&&root.contains(cv))){live.delete(cv);io&&io.unobserve(cv);}});}
function loop(ts){const t=ts/1000;live.forEach(cv=>{if(!cv.isConnected){live.delete(cv);return;}if(!cv._vis||cv.offsetParent===null)return;const [W,H]=fitCanvas(cv);if(!W||!H)return;drawFigure(cv.getContext("2d"),W,H,cv._m,t+cv._off);});requestAnimationFrame(loop);}

/* ---------- dose ---------- */
function parseDose(d){const m=d.match(/^(\d+)x(\d+)(m|s)?(e)?$/);if(!m)return{s:1,r:10};const s=+m[1],n=+m[2],u=m[3],e=!!m[4];return u==="m"?{s,t:n*60,e}:u==="s"?{s,t:n,e}:{s,r:n,e};}
function scaled(ex,lv){const d={...parseDose(ex.dose)};const long=d.t>=300;
  if(lv==="beginner"){if(!long)d.s=Math.max(1,d.s-1);if(d.r)d.r=Math.max(6,d.r-2);if(d.t)d.t=long?Math.round(d.t*.75/60)*60:Math.max(15,Math.round(d.t*.75/5)*5);}
  if(lv==="advanced"){if(!long&&d.s>=2)d.s+=1;if(d.r)d.r+=2;if(d.t)d.t=long?Math.round(d.t*1.25/60)*60:Math.round(d.t*1.25/5)*5;}
  return d;}
function fmtT(t){return t>=60?(Math.floor(t/60)+(t%60?":"+String(t%60).padStart(2,"0"):"")+" min"):t+" s";}
function doseLabel(ex,lv){const d=scaled(ex,lv);const each=d.e?(d.t?" /side":" each"):"";if(d.t)return(d.s>1?d.s+" × ":"")+fmtT(d.t)+each;return d.s+" × "+d.r+each;}
function exSeconds(ex,lv){const d=scaled(ex,lv);const work=d.t?d.t*(d.e?2:1):d.r*(d.e?2:1)*3.2;return d.s*work+(d.s-1)*REST[ex.cat]+20;}

function drawSpark(W,isEx){
  const cv=$("#spark");if(!cv||cv.offsetParent===null)return;const [w,h]=fitCanvas(cv);const c=cv.getContext("2d");c.clearRect(0,0,w,h);

   <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>Supplements, morning and night</h3>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px"><li>Multivitamin</li><li>Omega-3</li><li>Vitamin C</li><li>CoQ10</li></ul>
    <span class="muted" style="font-size:13px">The plan recommends these but doesn't give doses: follow each label. Ask a pharmacist first if you take any medication; CoQ10 and omega-3 can interact with blood thinners.</span></div></div>`;
  const shake=`<div class="tip"><b>Shake:</b> 1 scoop whey or plant protein (about 20 g protein) with water or unsweetened soy milk, or a Korean diet shake. No added sugar or artificial sweeteners, as the plan avoids both.</div>`;
  if(!S.soStart)return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Your Switch-On tracker</h3>
    <p class="muted" style="margin:0;font-size:14px">Start today and the app shows what to drink, eat and train each day for 28 days, and lets you tick off your shakes.</p>
    <div class="row"><button class="btn" id="soStart">Start my Switch-On today</button></div>${weeks}${shake}</div>${rules}<details class="card"><summary style="cursor:pointer;font-weight:700">How a 24-hour fast works</summary>${FAST_GUIDE}</details>`;
  const d=Math.floor((new Date(iso(new Date()))-new Date(S.soStart))/864e5)+1;const p=soPlan(d);
  const done=(S.soLog||{})[iso(new Date())]||0;
  const circles=p.shakes?`<div class="row" id="soShakes" aria-label="Shakes drunk today">${Array.from({length:p.shakes},(_,k)=>`<button class="btn small ${k<done?"mint":"ghost"}" data-n="${k+1}" aria-pressed="${k<done}">🥤 ${k+1}</button>`).join("")}<span class="muted" style="font-size:13px">${done}/${p.shakes} shakes today</span></div>`:"";
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
   <div class="row" style="justify-content:space-between"><div><span class="eyebrow">${d>28?"Program complete":`Day ${d} of 28 · week ${p.wk}`}</span><h3 style="font-size:20px">${esc(p.title)}</h3></div><button class="btn small ghost" id="soRestart">Restart</button></div>
   <div class="bar"><i style="width:${Math.min(100,Math.round(d/28*100))}%"></i></div>
   ${circles}
   <div style="overflow-x:auto"><table><tbody>${p.slots.map(s=>`<tr><th style="width:90px">${s[0]}</th><td>${esc(s[1])}</td></tr>`).join("")}</tbody></table></div>
   <div class="meals">
    <div class="meal"><span class="when">Food rules</span><span style="font-size:14px">${esc(p.eat)}</span></div>
    <div class="meal"><span class="when">Train</span><span style="font-size:14px">${esc(p.train)}</span></div>
   </div>
   ${p.note?`<span class="muted" style="font-size:13px">${esc(p.note)}</span>`:""}
   <details><summary style="cursor:pointer;font-weight:600">See all 4 weeks</summary>${weeks}</details>${shake}</div>
  ${(p.fastDay||SO_FAST[d+1])?FAST_GUIDE:(d>=8&&d<=28?`<details class="card"><summary style="cursor:pointer;font-weight:700">How a 24-hour fast works</summary>${FAST_GUIDE}</details>`:"")}${rules}
  <div class="warn"><b>Before you start.</b> Days 1–3 are only about 600–700 kcal; dietitians call that below what's safe for most adults without medical supervision. Expect tiredness, headaches or dizziness, and keep those days to walking only. Never put a 24-hour fast on a gym day: long fasts raise the risk of low blood sugar, so if you feel dizzy, shaky or faint, drink your shake early and stop the fast. Talk to a doctor or dietitian first if you have a health condition, take medication, have diabetes or low blood sugar, or have a history of disordered eating. Stop and eat normally if you feel faint or your period stops. The 4-week plan itself hasn't been tested in clinical trials.</div>`;
}

/* ---------- exercise sheet ---------- */
let lastFocus=null;
function openEx(id){const e=X[id];lastFocus=document.activeElement;const sh=$("#sheet");detachIn(sh);
  sh.innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><span class="tag c-${e.cat}">${e.cat}</span><h2 id="sheetTitle" style="margin-top:6px">${esc(e.name)}</h2></div><button class="x" id="shClose" aria-label="Close">✕</button></div>
  <canvas data-m="${e.motion}" aria-hidden="true"></canvas>
  <div class="row"><span class="chip"><b>${doseLabel(e,S.level)}</b></span><span class="chip">${esc(e.equip)}</span>${e.tg.map(t=>`<span class="chip">${TGT[t]}</span>`).join("")}</div>
  <h3>How to do it</h3><ol>${e.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>
  <div class="tip"><b>149 cm tip:</b> ${esc(e.tip)}</div>
  <div class="row"><button class="btn" id="shTry">▶ Do this exercise now</button></div>`;
  $("#sheetOv").hidden=false;sh.querySelectorAll("canvas[data-m]").forEach(cv=>attach(cv,cv.dataset.m));
  $("#shClose").onclick=closeSheet;$("#shTry").onclick=()=>{closeSheet();startList([id],e.name);};$("#shClose").focus();}
function closeSheet(){$("#sheetOv").hidden=true;detachIn($("#sheet"));lastFocus&&lastFocus.focus&&lastFocus.focus();}
$("#sheetOv").addEventListener("click",e=>{if(e.target.id==="sheetOv")closeSheet();});
window.__ppBack=function(){if(!$("#sheetOv").hidden){closeSheet();return true;}if(!$("#player").hidden){askEnd();return true;}if(S.tab!=="today"){setTab("today");return true;}return false;};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheetOv").hidden)closeSheet();else if(!$("#player").hidden)askEnd();}});

/* ---------- player ---------- */
let P=null,tick=null,audio=null,wake=null;
function beep(f,d){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.18,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+(d||.18));o.start();o.stop(audio.currentTime+(d||.18));}catch(e){}}
function startPlan(i){startList(PLAN[i].ex,PLAN[i].title);}
function startList(ids,title){
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume();}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}
  P={title,items:ids.map(id=>({e:X[id],d:scaled(X[id],S.level)})),i:0,set:1,side:1,phase:"work",left:0,running:false,start:Date.now(),last:Date.now(),confirm:false,done:false};
  enterWork();$("#player").hidden=false;document.body.style.overflow="hidden";renderPlayer();
  clearInterval(tick);tick=setInterval(step,200);
}
function cur(){return P.items[P.i];}
function enterWork(){const it=cur();P.phase="work";P.left=it.d.t||0;P.running=!!it.d.t&&P.i+P.set+P.side>3;}
function step(){if(!P||P.done||P.confirm)return;const now=Date.now(),dt=(now-P.last)/1000;P.last=now;if(!P.running)return;
  P.left-=dt;const s=Math.ceil(P.left);if(s<=3&&s>=1&&s!==P._b){P._b=s;beep(660);}
  if(P.left<=0){P._b=null;beep(990,.35);advance();}updClock();}
function advance(){const it=cur();
  if(P.phase==="work"){
    if(it.d.e&&P.side===1&&it.d.t){P.side=2;P.phase="rest";P.left=5;P.running=true;P.restNext="side";return renderPlayer();}
    if(P.set<it.d.s){P.phase="rest";P.left=REST[it.e.cat]||15;P.running=true;P.restNext="set";return renderPlayer();}
    if(P.i<P.items.length-1){P.phase="rest";P.left=30;P.running=true;P.restNext="ex";return renderPlayer();}
    return finish();
  } else {
    if(P.restNext==="side"){P.phase="work";P.left=it.d.t;P.running=true;}
    else if(P.restNext==="set"){P.set++;P.side=1;P.phase="work";P.left=it.d.t||0;P.running=!!it.d.t;}
    else{P.i++;P.set=1;P.side=1;P.phase="work";P.left=cur().d.t||0;P.running=!!cur().d.t;}
    renderPlayer();
  }}
function jump(dir){const n=P.i+dir;if(n<0||n>=P.items.length){if(dir>0)finish();return;}P.i=n;P.set=1;P.side=1;P.phase="work";P.left=cur().d.t||0;P.running=false;renderPlayer();}
function mmss(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");}
function updClock(){const c=$("#pClock");if(c&&(P.phase==="rest"||cur().d.t))c.textContent=mmss(P.left);
  const pb=$("#pBar");if(pb){pb.style.width=Math.round((P.i+(P.set-1)/cur().d.s)/P.items.length*100)+"%";}}
function renderPlayer(){
  const el=$("#player");detachIn(el);if(P.done)return renderDone();
  const it=cur(),e=it.e,d=it.d,rest=P.phase==="rest";
  const next=P.items[P.i+1];
  const label=rest?(P.restNext==="ex"?"Rest · next exercise":P.restNext==="side"?"Switch sides":"Rest between sets"):(d.t?"Work":"Do your reps");
  const big=rest||d.t?mmss(P.left):d.r+(d.e?" each side":"")+"";
  el.innerHTML=`<div class="ptop"><button class="x" id="pClose" aria-label="End workout">✕</button><div class="bar"><i id="pBar"></i></div><span class="mono muted" style="font-size:13px">${P.i+1}/${P.items.length}</span></div>
  <div class="pmain"><div class="pstage"><canvas data-m="${rest&&P.restNext==="ex"?"stand":e.motion}" aria-hidden="true"></canvas><span class="pphase tag c-${e.cat}">${e.cat}</span></div>
   <div class="pinfo"><span class="eyebrow">${esc(P.title)}</span><h2 style="font-size:clamp(24px,4vw,34px)">${rest&&P.restNext==="ex"?"Up next: "+esc(next.e.name):esc(e.name)}</h2>
    <div class="setdots" aria-label="Set ${P.set} of ${d.s}">${Array.from({length:d.s},(_,k)=>`<i class="${k+1<P.set||(k+1===P.set&&rest&&P.restNext!=="side")?"done":k+1===P.set?"cur":""}"></i>`).join("")}</div>
    <span class="muted">${label}${d.s>1?` · set ${P.set} of ${d.s}`:""}${d.e&&d.t?` · side ${P.side}`:""}</span>
    <div class="clock ${rest?"rest":""}" id="pClock" aria-live="polite">${big}</div>
    ${!rest&&!d.t?`<span class="muted">reps · slow and controlled</span>`:""}
    <ul class="pcues">${(rest&&P.restNext==="ex"?next.e:e).cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <div class="pctl">
     <button class="btn ghost" id="pPrev" ${P.i===0?"disabled":""}>‹ Prev</button>
     ${rest?`<button class="btn mint" id="pSkip">Skip rest</button>`:d.t?`<button class="btn" id="pPlay">${P.running?"❚❚ Pause":"▶ Start"}</button>`:`<button class="btn" id="pDone">✓ Set done</button>`}
     <button class="btn ghost" id="pNext">Next ›</button></div>
    ${next&&!(rest&&P.restNext==="ex")?`<span class="upnext">Up next: ${esc(next.e.name)} · ${doseLabel(next.e,S.level)}</span>`:""}
   </div></div>
   ${P.confirm?`<div class="confirm"><div class="card"><h3>End this workout?</h3><span class="muted">The time you've trained so far will be saved to Progress.</span><div class="row"><button class="btn" id="cEnd">End & save</button><button class="btn ghost" id="cKeep">Keep going</button></div></div></div>`:""}`;
  el.querySelectorAll("canvas[data-m]").forEach(cv=>attach(cv,cv.dataset.m));updClock();
  $("#pClose").onclick=askEnd;$("#pPrev").onclick=()=>jump(-1);$("#pNext").onclick=()=>jump(1);
  const pl=$("#pPlay");pl&&(pl.onclick=()=>{P.running=!P.running;P.last=Date.now();renderPlayer();});
  const sk=$("#pSkip");sk&&(sk.onclick=()=>{P.left=0;advance();});
  const dn=$("#pDone");dn&&(dn.onclick=()=>{beep(880);if(d.e&&P.side===1&&false){}advance();});
  if(P.confirm){$("#cEnd").onclick=finish;$("#cKeep").onclick=()=>{P.confirm=false;P.last=Date.now();renderPlayer();};$("#cKeep").focus();}
}
function askEnd(){if(!P)return;if(P.done){closePlayer();return;}P.confirm=true;renderPlayer();}
function finish(){if(!P)return;P.done=true;P.running=false;const mins=Math.max(1,Math.round((Date.now()-P.start)/60000));
  const done=P.items.slice(0,P.i+1);const kg=kgVal();const avgMet=done.reduce((a,x)=>a+MET[x.e.cat],0)/done.length;
  P.result={mins,kcal:Math.round(avgMet*3.5*kg/200*mins),count:done.length};
  S.log.push({date:iso(new Date()),title:P.title,mins,kcal:P.result.kcal});save();beep(1200,.5);renderDone();renderProg();}
function renderDone(){const el=$("#player");detachIn(el);const r=P.result;
  el.innerHTML=`<div class="done-wrap"><div class="pstage" style="width:100%;height:240px;min-height:240px"><canvas data-m="warrior" aria-hidden="true"></canvas></div>
  <span class="eyebrow">Workout saved</span><h1 style="font-size:40px">Great work!</h1><p class="muted" style="margin:0">${esc(P.title)}</p>
  <div class="stats" style="width:100%"><div class="stat"><div class="v mono">${r.mins}</div><div class="l">minutes</div></div><div class="stat"><div class="v mono">~${r.kcal}</div><div class="l">kcal (estimate)</div></div><div class="stat"><div class="v mono">${r.count}</div><div class="l">exercises</div></div></div>
  <button class="btn" id="dClose">Back to my plan</button></div>`;
  el.querySelectorAll("canvas[data-m]").forEach(cv=>attach(cv,cv.dataset.m));$("#dClose").onclick=closePlayer;$("#dClose").focus();}
function closePlayer(){clearInterval(tick);P=null;$("#player").hidden=true;detachIn($("#player"));$("#player").innerHTML="";document.body.style.overflow="";try{wake&&wake.release();}catch(e){}wake=null;setTab("prog");}

/* ---------- tabs ---------- */
function setTab(t){S.tab=t;save();document.querySelectorAll('[role="tab"]').forEach(b=>{const on=b.dataset.tab===t;b.setAttribute("aria-selected",String(on));b.tabIndex=on?0:-1;});
  document.querySelectorAll('[role="tabpanel"]').forEach(p=>p.hidden=p.id!=="p-"+t);$("#hero").hidden=t!=="today";window.scrollTo(0,0);if(t==="prog")requestAnimationFrame(()=>renderProg());}
document.querySelectorAll('[role="tab"]').forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
window.addEventListener("resize",()=>{if(S.tab==="prog"){const isEx=!S.weights.length;drawSpark(isEx?EX_W:S.weights.slice(-20),isEx);}});

/* ---------- hero ---------- */
const SHOW=[["squat","Goblet squat"],["bridge","Barbell hip thrust"],["run","Treadmill intervals"],["press","Shoulder press"],["hundred","Pilates hundred"],["legpress","Leg press machine"],["dog","Downward dog flow"],["cycle","Cycling machine"],["lunge","Reverse lunge"],["climber","Mountain climbers"],["chair","Leg raise machine"],["raise","Lateral raise"],["step","Stair stepper"],["warrior","Warrior I"]];
const hc=$("#heroCanvas");attach(hc,"squat");let si=0;
if(!RM.matches)setInterval(()=>{si=(si+1)%SHOW.length;hc._m=M[SHOW[si][0]];$("#heroTag").textContent=SHOW[si][1];},5200);
$("#heroStart").addEventListener("click",()=>startPlan(todayIdx()));

function renderAll(){const p=PLAN[todayIdx()];$("#heroToday").textContent=DAYNAMES[todayIdx()]+": "+p.title+" · "+planMins(p,S.level)+" min";
  const so=S.soStart?Math.floor((new Date(iso(new Date()))-new Date(S.soStart))/864e5)+1:0;
  $("#appbarDay").textContent=DAYNAMES[todayIdx()]+(so>=1&&so<=28?" · Switch-On day "+so:"");
  $("#greetEyebrow").textContent=DAYNAMES[todayIdx()]+" · "+planMins(p,S.level)+" min";
  $("#greetLine").textContent=todayIdx()===6?"Rest day! A gentle stretch and a walk.":"Let's do "+p.title.toLowerCase()+"!";renderToday();renderWeek();renderLib();renderDiet();renderTips();renderProg();}
renderLevel();renderAll();setTab(S.tab||"today");
})();
</script>
